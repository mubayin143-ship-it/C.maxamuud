    <script>
      (function() {
        // 1. Monkey-patch ResizeObserver to always defer callbacks to requestAnimationFrame
        if (typeof window !== 'undefined' && window.ResizeObserver) {
          var NativeResizeObserver = window.ResizeObserver;
          window.ResizeObserver = function(callback) {
            return new NativeResizeObserver(function(entries, observer) {
              window.requestAnimationFrame(function() {
                try {
                  callback(entries, observer);
                } catch (e) {
                  // Suppress benign ResizeObserver callback errors
                }
              });
            });
          };
          window.ResizeObserver.prototype = NativeResizeObserver.prototype;
        }

        // 2. Global error suppression for ResizeObserver loop notifications in capture phase
        var isResizeObserverError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
                 str.indexOf('ResizeObserver loop limit exceeded') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isResizeObserverError(e.message) || isResizeObserverError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isResizeObserverError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(message) {
          if (isResizeObserverError(message)) {
            return true;
          }
          if (origOnError) {
            return origOnError.apply(this, arguments);
          }
        };
      })();
    </script>
